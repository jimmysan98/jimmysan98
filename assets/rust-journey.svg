<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 132" width="900" height="132" role="img" aria-label="Rust Learning Roadmap">
  <title>Rust Learning Journey</title>
  <defs>
    <linearGradient id="rustBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F74C00"/>
      <stop offset="55%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="130" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Header -->
  <text x="26" y="34" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F0F6FC">
    🦀 Rust Learning Roadmap
  </text>
  <rect x="734" y="16" width="140" height="26" rx="13" fill="#161B22" stroke="#38BDF8" stroke-opacity="0.5"/>
  <text x="804" y="33" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" font-weight="600" fill="#38BDF8">45% · In Progress</text>

  <!-- Progress Track -->
  <rect x="26" y="54" width="848" height="14" rx="7" fill="#161B22" stroke="#21262D" stroke-width="1"/>
  <rect x="26" y="54" width="382" height="14" rx="7" fill="url(#rustBarGrad)">
    <animate attributeName="width" from="24" to="382" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- Milestone Pills -->
  <g transform="translate(26, 86)" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5">
    <rect x="0" y="0" width="194" height="28" rx="7" fill="#161B22" stroke="#3FB950" stroke-opacity="0.45"/>
    <text x="97" y="18" text-anchor="middle" fill="#3FB950">✓ Syntax &amp; Ownership</text>

    <rect x="210" y="0" width="194" height="28" rx="7" fill="#161B22" stroke="#3FB950" stroke-opacity="0.45"/>
    <text x="307" y="18" text-anchor="middle" fill="#3FB950">✓ Cargo &amp; Crates</text>

    <rect x="420" y="0" width="214" height="28" rx="7" fill="#161B22" stroke="#FF6B9D" stroke-opacity="0.7"/>
    <circle cx="437" cy="14" r="3.5" fill="#FF6B9D">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="534" y="18" text-anchor="middle" fill="#FFB3CC">Borrowing &amp; Lifetimes</text>

    <rect x="650" y="0" width="198" height="28" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="749" y="18" text-anchor="middle" fill="#8B949E">○ Async &amp; CLI Apps</text>
  </g>
</svg>
